<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">

  <div id="mainApp" class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">అధికారిక రికార్డుల & నోటీస్ ట్రాకర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" onclick="pickContact()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
          <i class="fas fa-address-book"></i> కాంటాక్ట్
        </button>
      </div>

      <!-- 1st STEP: Category Dropdown -->
      <div class="bg-amber-50/80 p-3 rounded-xl border-2 border-amber-300">
        <label class="block text-xs font-bold text-amber-900 mb-1 flex items-center gap-1.5">
          <i class="fas fa-list-check text-amber-600"></i> విభాగం ఎంచుకోండి (Category) <span class="text-red-500">*</span>
        </label>
        <select id="categorySelect" onchange="syncMsg()" class="w-full border-2 border-amber-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 bg-white outline-none focus:border-indigo-600">
          <option value="Mutations" selected>1. Mutations (మ్యుటేషన్స్)</option>
          <option value="PGRS">2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)</option>
          <option value="Mandala arjilu">3. Mandala arjilu (మండల అర్జీలు)</option>
          <option value="Others">4. Others (ఇతరములు)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person) <span class="text-red-500">*</span></label>
        <input type="text" id="name" oninput="syncMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాజేష్">
      </div>

      <!-- Phone Number with +91 Prefix -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ <span class="text-red-500">*</span></label>
        <div class="flex items-center border rounded-xl overflow-hidden focus-within:border-indigo-600 bg-white">
          <span class="bg-slate-100 text-slate-700 font-bold px-3 py-2.5 text-sm border-r select-none">+91</span>
          <input type="tel" id="phone" maxlength="10" class="w-full p-2.5 text-sm outline-none" placeholder="9876543210">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ <span class="text-red-500">*</span></label>
        <input type="text" id="docName" oninput="syncMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు">
      </div>

      <!-- Camera & PDF Attachment Section -->
      <div class="bg-indigo-50/90 p-3 rounded-xl border border-indigo-200 space-y-2">
        <label class="block text-xs font-bold text-indigo-900">
          📸 డాక్యుమెంట్ ఫోటో లేదా PDF జతచేయండి:
        </label>
        <div class="grid grid-cols-2 gap-2">
          <label class="cursor-pointer bg-emerald-600 active:bg-emerald-700 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-camera text-lg"></i>
            <span class="text-xs font-bold">కెమెరా ఓపెన్ చేయి</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="fileChosen(this)" class="hidden">
          </label>
          <label class="cursor-pointer bg-indigo-700 active:bg-indigo-800 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-file-pdf text-lg"></i>
            <span class="text-xs font-bold">PDF / ఫైల్స్</span>
            <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="fileChosen(this)" class="hidden">
          </label>
        </div>
        <div id="fileBadge" class="hidden bg-emerald-100 border border-emerald-300 text-emerald-900 text-xs p-2 rounded-xl font-bold flex items-center justify-between">
          <span id="fileBadgeText" class="truncate max-w-[220px]"></span>
          <button type="button" onclick="removeFile()" class="text-red-600 font-extrabold ml-2">✕ తీసివేయి</button>
        </div>
      </div>

      <!-- Due Date Selection (Direct Fixed Value in HTML) -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు రోజులు</label>
          <select id="daysSelect" onchange="applyDays()" class="w-full border rounded-lg p-2 text-xs bg-white outline-none">
            <option value="1">1 రోజు</option>
            <option value="2">2 రోజులు</option>
            <option value="7" selected>7 రోజులు</option>
            <option value="15">15 రోజులు</option>
            <option value="30">30 రోజులు</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు తేదీ (Due Date)</label>
          <input type="date" id="dueDateInput" value="2026-10-17" oninput="onDateInputManual()" onchange="onDateInputManual()" class="w-full border rounded-lg p-1.5 text-xs bg-white font-semibold outline-none focus:border-indigo-600">
        </div>
      </div>

      <!-- Message Preview Box -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్ ప్రివ్యూ:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly>*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*

నమస్కారం [గ్రహీత పేరు] గారు,

మీకు *[రిఫరెన్స్ వివరాలు]* సంబంధించిన (Mutations) ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.

దయచేసి దీనిని విచారించి *7 రోజుల్లోగా* (చివరి తేదీ: *17/10/2026*) మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.

ఇట్లు,
*తహసీల్దార్ కార్యాలయం,*
*పెద్దవడుగూరు.*</textarea>
      </div>

      <button type="button" onclick="sendWhatsAppNotice()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    let pickedFile = null;

    function fileChosen(input) {
      if (input.files && input.files[0]) {
        pickedFile = input.files[0];
        document.getElementById('fileBadge').classList.remove('hidden');
        const isImg = pickedFile.type.startsWith('image/');
        document.getElementById('fileBadgeText').innerText = isImg 
          ? `📸 Photo: ${pickedFile.name || 'Captured Image'}` 
          : `📄 PDF: ${pickedFile.name}`;
      }
    }

    function removeFile() {
      pickedFile = null;
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('fileBadge').classList.add('hidden');
    }

    function applyDays() {
      const days = Number(document.getElementById('daysSelect').value) || 7;
      const d = new Date();
      d.setDate(d.getDate() + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('dueDateInput').value = `${yyyy}-${mm}-${dd}`;
      syncMsg();
    }

    function onDateInputManual() {
      syncMsg();
    }

    function syncMsg() {
      const category = document.getElementById('categorySelect').value || 'Mutations';
      const name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      const doc = document.getElementById('docName').value.trim() || '[రిఫరెన్స్ వివరాలు]';
      const dateVal = document.getElementById('dueDateInput').value;

      let dateFormatted = '17/10/2026';
      let days = document.getElementById('daysSelect').value || '7';

      if (dateVal) {
        const parts = dateVal.split('-');
        if (parts.length === 3) {
          dateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
          const target = new Date(parts[0], parts[1] - 1, parts[2]);
          const now = new Date();
          now.setHours(0,0,0,0);
          target.setHours(0,0,0,0);
          const diff = Math.round((target - now) / (1000 * 60 * 60 * 24));
          if (diff > 0) days = diff;
        }
      }

      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\nనమస్కారం ${name} గారు,\n\nమీకు *${doc}* సంబంధించిన (${category}) ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.\n\nదయచేసి దీనిని విచారించి *${days} రోజుల్లోగా* (చివరి తేదీ: *${dateFormatted}*) మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;

      document.getElementById('customMsg').value = text;
    }

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem('f8_records') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      renderDashboard();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function sendWhatsAppNotice() {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('name').value.trim();
      let rawPhone = document.getElementById('phone').value.trim();
      const doc = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateInput').value;
      const msg = document.getElementById('customMsg').value;

      if (!name || !rawPhone || !doc || !dueDateVal) {
        alert('దయచేసి పేరు, ఫోన్ నంబర్, డాక్యుమెంట్ వివరాలు మరియు గడువు తేదీని నమోదు చేయండి!');
        return;
      }

      let cleanDigits = rawPhone.replace(/[^0-9]/g, '');
      if (cleanDigits.length > 10) cleanDigits = cleanDigits.slice(-10);
      if (cleanDigits.length !== 10) {
        alert('సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి!');
        return;
      }

      let fileDataUrl = null;
      let fileName = null;
      let fileType = null;
      if (pickedFile) {
        fileName = pickedFile.name || 'Captured_Doc';
        fileType = pickedFile.type.startsWith('image/') ? 'IMAGE' : 'PDF';
        try {
          fileDataUrl = await readFileAsDataURL(pickedFile);
        } catch(e) {}
      }

      const today = new Date();
      const parts = dueDateVal.split('-');
      const formattedDue = `${parts[2]}/${parts[1]}/${parts[0]}`;

      const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      now.setHours(0,0,0,0);
      targetDate.setHours(0,0,0,0);
      const diff = Math.round((targetDate - now) / (1000 * 60 * 60 * 24));

      const record = {
        id: Date.now(),
        category,
        name,
        phone: cleanDigits,
        docName: doc,
        fileName: fileName,
        fileData: fileDataUrl,
        fileType: fileType,
        sentDate: `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`,
        dueDate: formattedDue,
        dueDateRaw: dueDateVal,
        daysAllowed: diff > 0 ? diff : 1,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      removeFile();
      document.getElementById('daysSelect').value = '7';
      applyDays();

      if (pickedFile && navigator.canShare && navigator.canShare({ files: [pickedFile] })) {
        try {
          await navigator.share({
            files: [pickedFile],
            title: `${category}: ${doc}`,
            text: msg
          });
          return;
        } catch (e) {}
      }

      window.location.href = `https://api.whatsapp.com/send?phone=91${cleanDigits}&text=${encodeURIComponent(msg)}`;
    }

    function viewAttachment(id) {
      const item = getEntries().find(r => r.id === id);
      if (item && item.fileData) {
        const newWindow = window.open();
        if (item.fileType === 'IMAGE') {
          newWindow.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;"><img src="${item.fileData}" style="max-width:100%;max-height:100vh;object-fit:contain;"></body>`);
        } else {
          newWindow.document.write(`<iframe src="${item.fileData}" frameborder="0" style="border:0;width:100%;height:100%;" allowfullscreen></iframe>`);
        }
      }
    }

    function markReturned(id) {
      saveEntries(getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item));
    }

    function sendReminder(phone, name, docName, dueDateStr, category) {
      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n*అత్యవసర రిమైండర్:*\n${name} గారు, మీకు ఇచ్చిన *${docName}* (${category}) విచారణ గడువు తేదీ (*${dueDateStr}*) ముగిసినది.\n\nమీరు నివేదిక సమర్పించడంలో ఆలస్యం (Delay) చేస్తున్నారు. దయచేసి వెంటనే విచారణ నివేదికను సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      window.location.href = `https://api.whatsapp.com/send?phone=91${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
        saveEntries(getEntries().filter(item => item.id !== id));
      }
    }

    function renderDashboard() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      if (!container) return;

      const todayStr = new Date().toISOString().split('T')[0];
      const pendingCount = list.filter(item => item.status === 'PENDING').length;
      document.getElementById('pendingCount').innerText = `${pendingCount} Pending`;

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && todayStr > item.dueDateRaw;
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-1.5">
                  <p class="font-bold text-sm text-slate-800">${item.name}</p>
                  <span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-bold">${item.category || 'Mutations'}</span>
                </div>
                <p class="text-slate-500 font-mono text-[11px] mt-0.5">+91 ${item.phone}</p>
                <p class="text-indigo-700 font-semibold mt-0.5">${item.docName}</p>
                ${item.fileName ? `
                  <p class="text-slate-500 text-[10px] mt-0.5 flex items-center gap-1">
                    <i class="fas ${item.fileType === 'IMAGE' ? 'fa-camera text-emerald-600' : 'fa-file-pdf text-red-500'}"></i> ${item.fileName}
                  </p>
                ` : ''}
              </div>
              <div class="flex flex-col items-end gap-1">
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ రిపోర్ట్ వచ్చింది</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold text-[10px] animate-pulse">Overdue (ఆలస్యం)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">పెండింగ్</span>'}
                <span class="text-[10px] text-slate-400 font-medium">గడువు: ${item.daysAllowed} రోజులు</span>
              </div>
            </div>

            <div class="flex justify-between text-slate-500 border-t pt-2 text-[11px]">
              <span>పంపినది: <b>${item.sentDate}</b></span>
              <span>చివరి తేదీ: <b class="${isOverdue ? 'text-red-600' : ''}">${item.dueDate}</b></span>
            </div>

            <div class="flex flex-wrap gap-1.5 pt-1 border-t">
              ${item.fileData ? `
                <button onclick="viewAttachment(${item.id})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold px-2.5 py-1.5 rounded-lg text-center flex items-center gap-1">
                  <i class="fas ${item.fileType === 'IMAGE' ? 'fa-image text-emerald-600' : 'fa-eye text-indigo-600'}"></i> ${item.fileType === 'IMAGE' ? 'ఫోటో చూడు' : 'PDF చూడు'}
                </button>
              ` : ''}

              ${item.status === 'PENDING' ? `
                <button onclick="sendReminder('${item.phone}', '${item.name}', '${item.docName}', '${item.dueDate}', '${item.category || 'Mutations'}')" class="flex-1 bg-amber-500 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">
                  🔔 రిమైండ్
                </button>
