<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-8 Mutation Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">
  <div class="max-w-md mx-auto space-y-4">
    <!-- Header -->
    <div class="bg-indigo-700 text-white p-5 rounded-2xl shadow">
      <h1 class="text-xl font-bold">📄 F-8 రిమైండర్ ట్రాకర్</h1>
      <p class="text-indigo-200 text-xs">PDF & 15 రోజుల గడువు ట్రాకింగ్</p>
    </div>

    <!-- Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <h2 class="text-base font-bold text-slate-700">కొత్త ఎంట్రీ & షేర్</h2>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు</label>
        <input type="text" id="name" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాము">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ (10 అంకెలు)</label>
        <input type="tel" id="phone" maxlength="10" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="9876543210">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / F-8 నంబర్</label>
        <input type="text" id="docName" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 Mutation Report">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">PDF ఫైల్ ఎంచుకోండి (తప్పనిసరి)</label>
        <input type="file" id="pdfFile" accept=".pdf" class="w-full border rounded-xl p-2 text-xs text-slate-500">
      </div>

      <button type="button" onclick="handleSend()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow">
        📲 PDF & మెసేజ్ షేర్ చేయి (WhatsApp)
      </button>
    </div>

    <!-- Records -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <h2 class="text-base font-bold text-slate-700 mb-3">రికార్డుల లిస్ట్</h2>
      <div id="recordList" class="space-y-3">
        <!-- Records here -->
      </div>
    </div>
  </div>

  <script>
    function getEntries() {
      return JSON.parse(localStorage.getItem('f8_records') || '[]');
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      render();
    }

    async function handleSend() {
      const name = document.getElementById('name').value.trim();
      let phone = document.getElementById('phone').value.trim();
      const docName = document.getElementById('docName').value.trim();
      const fileInput = document.getElementById('pdfFile');
      const file = fileInput.files[0];

      if (!name || !phone || !docName) {
        alert('దయచేసి పేరు, ఫోన్ నంబర్ మరియు డాక్యుమెంట్ పేరు నమోదు చేయండి!');
        return;
      }

      phone = phone.replace(/[^0-9]/g, '');
      if (phone.length === 10) phone = '91' + phone;

      const sentDate = new Date();
      const dueDate = new Date();
      dueDate.setDate(dueDate.getDate() + 15);

      const record = {
        id: Date.now(),
        name,
        phone,
        docName,
        sentDate: sentDate.toLocaleDateString('en-GB'),
        dueDate: dueDate.toLocaleDateString('en-GB'),
        dueTime: dueDate.getTime(),
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      const messageText = `నమస్కారం ${name} గారు, మీకు ${docName} పంపడం జరిగినది. దయచేసి విచారించి 15 రోజుల్లోగా రిపోర్ట్ ఇవ్వగలరు.`;

      // 1. మొబైల్ నేటివ్ షేరింగ్ (PDF + Text రెండూ వెళ్తాయి)
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: docName,
            text: messageText
          });
          document.getElementById('name').value = '';
          document.getElementById('phone').value = '';
          document.getElementById('docName').value = '';
          fileInput.value = '';
          return;
        } catch (err) {
          console.log('Share canceled');
        }
      }

      // 2. ఒకవేళ బ్రౌజర్ ఫైల్ షేర్ సపోర్ట్ చేయకపోతే వాట్సాప్ చాట్ ఓపెన్ అవుతుంది
      alert('ఫైల్ షేర్ విండో ఓపెన్ అవుతోంది. వాట్సాప్ ఎంచుకుని పంపండి.');
      window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(messageText)}`;
    }

    function markReturned(id) {
      const list = getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item);
      saveEntries(list);
    }

    function sendReminder(phone, name, docName) {
      const text = `రిమైండర్: ${name} గారు, మీరు ఇవ్వాల్సిన ${docName} గడువు 15 రోజులు ముగిసింది. దయచేసి ఆలస్యం చేయకుండా వెంటనే రిపోర్ట్ ఇవ్వండి.`;
      window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(text)}`;
    }

    function render() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      const now = Date.now();

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && now > item.dueTime;
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-sm text-slate-800">${item.name}</p>
                <p class="text-slate-500 font-mono">${item.phone}</p>
                <p class="text-indigo-600 font-medium mt-0.5">${item.docName}</p>
              </div>
              <div>
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">Returned</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Overdue (Delay)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">Pending</span>'}
              </div>
            </div>

            <div class="flex justify-between text-slate-500 border-t pt-2">
              <span>పంపినది: <b>${item.sentDate}</b></span>
              <span>గడువు: <b>${item.dueDate}</b></span>
            </div>

            ${item.status === 'PENDING' ? `
              <div class="flex gap-2 pt-1">
                <button onclick="sendReminder('${item.phone}', '${item.name}', '${item.docName}')" class="flex-1 bg-amber-500 text-white font-bold py-1.5 rounded-lg text-center">
                  🔔 రిమైండ్
                </button>
                <button onclick="markReturned(${item.id})" class="flex-1 bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-center">
                  ✓ రిటర్న్ వచ్చింది
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
