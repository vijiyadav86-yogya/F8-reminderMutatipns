<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F-8 Mutation & PDF Reminder Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-700 text-white p-5 rounded-2xl shadow">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fas fa-file-invoice"></i> F-8 రిమైండర్ ట్రాకర్
      </h1>
      <p class="text-indigo-200 text-xs mt-1">PDF అప్‌లోడ్, కస్టమ్ గడువు & వాట్సాప్ రిమైండర్</p>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
        <i class="fas fa-plus-circle text-indigo-600"></i> కొత్త ఎంట్రీ & PDF షేర్
      </h2>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (Person Name)</label>
        <input type="text" id="name" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాము">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ (10 అంకెలు)</label>
        <input type="tel" id="phone" maxlength="10" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="9876543210">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / F-8 నంబర్</label>
        <input type="text" id="docName" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 Mutation Report">
      </div>

      <!-- PDF File Upload Box -->
      <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-200">
        <label class="block text-xs font-bold text-indigo-900 mb-1 flex items-center gap-1">
          <i class="fas fa-file-pdf text-red-500"></i> PDF డాక్యుమెంట్ ఎంచుకోండి (తప్పనిసరి)
        </label>
        <input type="file" id="pdfFile" accept="application/pdf" class="w-full border rounded-xl p-2 text-xs text-slate-600 bg-white file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white file:text-xs">
        <p class="text-[10px] text-indigo-600 mt-1">* ఈ PDF వాట్సాప్ షేర్ ద్వారా నేరుగా అవతలి వ్యక్తికి వెళ్తుంది.</p>
      </div>

      <!-- Custom Days or Custom Date Selection -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు రోజులు (Days)</label>
          <select id="daysSelect" onchange="handleDaysChange()" class="w-full border rounded-lg p-2 text-xs bg-white outline-none focus:border-indigo-600 font-medium">
            <option value="2">2 రోజులు</option>
            <option value="7">7 రోజులు (1 వారం)</option>
            <option value="15" selected>15 రోజులు</option>
            <option value="30">30 రోజులు (1 నెల)</option>
            <option value="custom">కస్టమ్ రోజులు...</option>
          </select>
          <input type="number" id="customDaysInput" placeholder="రోజుల సంఖ్య" class="hidden mt-1.5 w-full border rounded-lg p-1.5 text-xs outline-none" oninput="updateDueDateByDays(this.value)">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు తేదీ (Due Date)</label>
          <input type="date" id="dueDateInput" class="w-full border rounded-lg p-1.5 text-xs bg-white outline-none focus:border-indigo-600">
        </div>
      </div>

      <button type="button" onclick="handleSend()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-lg"></i> PDF & మేసేజ్ వాట్సాప్‌లో పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3">
        <!-- Records render here -->
      </div>
    </div>

  </div>

  <script>
    function formatDateYMD(d) {
      return d.toISOString().split('T')[0];
    }

    function initDueDate() {
      const target = new Date();
      target.setDate(target.getDate() + 15);
      document.getElementById('dueDateInput').value = formatDateYMD(target);
    }

    function handleDaysChange() {
      const sel = document.getElementById('daysSelect').value;
      const customInput = document.getElementById('customDaysInput');
      
      if (sel === 'custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
        updateDueDateByDays(parseInt(sel, 10));
      }
    }

    function updateDueDateByDays(daysCount) {
      const days = parseInt(daysCount, 10);
      if (!isNaN(days) && days > 0) {
        const d = new Date();
        d.setDate(d.getDate() + days);
        document.getElementById('dueDateInput').value = formatDateYMD(d);
      }
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('f8_records') || '[]');
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      render();
    }

    async function handleSend() {
      const name = document.getElementById('name').value.trim();
      let phone = document.getElementById('phone').value.trim();
      const docName = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateInput').value;
      const fileInput = document.getElementById('pdfFile');
      const file = fileInput.files[0];

      if (!name || !phone || !docName || !dueDateVal) {
        alert('Dayachesi Peru, Phone Number, Document Peru mariyu Gaduvu Thedi enter cheyandi!');
        return;
      }

      phone = phone.replace(/[^0-9]/g, '');
      if (phone.length < 10) {
        alert('Saraina 10 ankela Mobile Number ivvandi!');
        return;
      }
      if (phone.length === 10) phone = '91' + phone;

      const sentDate = new Date();
      const dueDateObj = new Date(dueDateVal);
      const diffTime = dueDateObj - sentDate;
      const diffDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));

      const record = {
        id: Date.now(),
        name,
        phone,
        docName,
        fileName: file ? file.name : 'PDF File',
        sentDate: sentDate.toLocaleDateString('en-GB'),
        dueDate: dueDateObj.toLocaleDateString('en-GB'),
        dueDateRaw: dueDateVal,
        daysAllowed: diffDays,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      const messageText = `నమస్కారం ${name} గారు, మీకు ${docName} పంపడం జరిగినది. దయచేసి విచారించి ${diffDays} రోజుల్లోగా (${record.dueDate}) రిపోర్ట్ ఇవ్వగలరు.`;

      // Clear Form Fields
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      document.getElementById('daysSelect').value = '15';
      document.getElementById('customDaysInput').classList.add('hidden');
      initDueDate();

      // Mobile Web Share tho PDF + Text Direct Sharing
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: docName,
            text: messageText
          });
          fileInput.value = '';
          return;
        } catch (e) {
          console.log('Share dismissed');
        }
      }

      // WhatsApp URL fallback
      fileInput.value = '';
      window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(messageText)}`;
    }

    function markReturned(id) {
      const list = getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item);
      saveEntries(list);
    }

    function sendReminder(phone, name, docName, dueDateStr) {
      const text = `రిమైండర్: ${name} గారు, మీరు ఇవ్వాల్సిన ${docName} గడువు (${dueDateStr}) ముగిసింది. దయచేసి ఆలస్యం చేయకుండా వెంటనే రిపోర్ట్ ఇవ్వండి.`;
      window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('Ee record ni delete cheyalani anukuntunnara?')) {
        const list = getEntries().filter(item => item.id !== id);
        saveEntries(list);
      }
    }

    function render() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      const today = formatDateYMD(new Date());

      const pendingCount = list.filter(item => item.status === 'PENDING').length;
      document.getElementById('pendingCount').innerText = `${pendingCount} Pending`;

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Inka elanti records levu.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && today > item.dueDateRaw;

        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs hover:border-indigo-300 transition">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-sm text-slate-800">${item.name}</p>
                <p class="text-slate-500 font-mono text-[11px]">${item.phone}</p>
                <p class="text-indigo-600 font-medium mt-0.5">${item.docName}</p>
                <p class="text-slate-400 text-[10px] mt-0.5"><i class="fas fa-paperclip"></i> ${item.fileName}</p>
              </div>
              <div class="flex flex-col items-end gap-1">
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ Returned</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold text-[10px] animate-pulse">Overdue (Delay)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">Pending</span>'}
                <span class="text-[10px] text-slate-400 font-medium">Gaduvu: ${item.daysAllowed} Days</span>
              </div>
            </div>

            <div class="flex justify-between text-slate-500 border-t pt-2 text-[11px]">
              <span>Pampinadi: <b>${item.sentDate}</b></span>
              <span>Chivari Thedi: <b class="${isOverdue ? 'text-red-600 font-bold' : ''}">${item.dueDate}</b></span>
            </div>

            <div class="flex gap-2 pt-1 border-t">
              ${item.status === 'PENDING' ? `
                <button onclick="sendReminder('${item.phone}', '${item.name}', '${item.docName}', '${item.dueDate}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">
                  🔔 Remind
                </button>
                <button onclick="markReturned(${item.id})" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">
                  ✓ Return Vachindi
                </button>
              ` : `
                <button disabled class="flex-1 bg-slate-200 text-slate-400 font-bold py-1.5 rounded-lg text-center cursor-not-allowed">
                  Purtayyindi
                </button>
              `}
              <button onclick="deleteRecord(${item.id})" class="px-2.5 py-1.5 bg-slate-200 text-slate-600 rounded-lg hover:bg-red-100 hover:text-red-600">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    initDueDate();
    render();
  </script>
</body>
</html>
