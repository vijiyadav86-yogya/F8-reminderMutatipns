<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">

  <div id="mainApp" class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">అధికారిక రికార్డుల & నోటీస్ ట్రాకర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" onclick="pickContact()" class="bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 border border-indigo-200 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
          <i class="fas fa-address-book text-indigo-600"></i> కాంటాక్ట్ ఎంచుకో
        </button>
      </div>

      <!-- Category Dropdown -->
      <div class="bg-amber-50/80 p-3 rounded-xl border-2 border-amber-300">
        <label class="block text-xs font-bold text-amber-900 mb-1 flex items-center gap-1.5">
          <i class="fas fa-list-check text-amber-600"></i> విభాగం ఎంచుకోండి (Category) <span class="text-red-500">*</span>
        </label>
        <select id="categorySelect" onchange="updateNoticeText()" class="w-full border-2 border-amber-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 bg-white outline-none focus:border-indigo-600">
          <option value="" selected>-- ఎంచుకోండి (Select Category) --</option>
          <option value="Mutations">1. Mutations (మ్యుటేషన్స్)</option>
          <option value="PGRS">2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)</option>
          <option value="Mandala arjilu">3. Mandala arjilu (మండల అర్జీలు)</option>
          <option value="Others">4. Others (ఇతరములు)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person) <span class="text-red-500">*</span></label>
        <input type="text" id="name" oninput="updateNoticeText()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాజేష్">
      </div>

      <!-- Phone Number with +91 Prefix -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ <span class="text-red-500">*</span></label>
        <div class="flex items-center border rounded-xl overflow-hidden focus-within:border-indigo-600 bg-white">
          <span class="bg-slate-100 text-slate-700 font-bold px-3 py-2.5 text-sm border-r select-none">+91</span>
          <input type="tel" id="phone" maxlength="10" class="w-full p-2.5 text-sm outline-none" placeholder="9876543210">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ <span class="text-red-500">*</span></label>
        <input type="text" id="docName" oninput="updateNoticeText()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు">
      </div>

      <!-- Camera & PDF Attachment Section -->
      <div class="bg-indigo-50/90 p-3 rounded-xl border border-indigo-200 space-y-2">
        <label class="block text-xs font-bold text-indigo-900">
          📸 డాక్యుమెంట్ ఫోటో లేదా PDF జతచేయండి:
        </label>
        <div class="grid grid-cols-2 gap-2">
          <label class="cursor-pointer bg-emerald-600 active:bg-emerald-700 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-camera text-lg"></i>
            <span class="text-xs font-bold">కెమెరా ఓపెన్ చేయి</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="fileChosen(this)" class="hidden">
          </label>
          <label class="cursor-pointer bg-indigo-700 active:bg-indigo-800 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-file-pdf text-lg"></i>
            <span class="text-xs font-bold">PDF / ఫైల్స్</span>
            <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="fileChosen(this)" class="hidden">
          </label>
        </div>
        <div id="fileBadge" class="hidden bg-emerald-100 border border-emerald-300 text-emerald-900 text-xs p-2 rounded-xl font-bold flex items-center justify-between">
          <span id="fileBadgeText" class="truncate max-w-[220px]"></span>
          <button type="button" onclick="removeFile()" class="text-red-600 font-extrabold ml-2">✕ తీసివేయి</button>
        </div>
      </div>

      <!-- Due Date Selection Section -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు రోజులు మార్చు</label>
          <select id="daysSelect" onchange="onDaysChange()" class="w-full border rounded-lg p-2 text-xs bg-white font-bold outline-none border-indigo-200 focus:border-indigo-600">
            <option value="1">1 రోజు</option>
            <option value="2">2 రోజులు</option>
            <option value="3" selected>3 రోజులు</option>
            <option value="5">5 రోజులు</option>
            <option value="7">7 రోజులు</option>
            <option value="10">10 రోజులు</option>
            <option value="15">15 రోజులు</option>
            <option value="30">30 రోజులు</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు తేదీ (Due Date)</label>
          <input type="date" id="datePickerInput" onchange="onCustomDateChange()" class="w-full border rounded-lg p-1.5 text-xs bg-white font-bold outline-none border-indigo-200 focus:border-indigo-600 text-slate-700">
        </div>
      </div>

      <!-- Message Preview Box -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్ ప్రివ్యూ:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly></textarea>
      </div>

      <button type="button" onclick="sendWhatsAppNotice()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    var pickedFile = null;

    // Contact Picker with fallback check
    async function pickContact() {
      if ('contacts' in navigator && 'select' in navigator.contacts) {
        try {
          var res = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (res && res.length > 0) {
            var person = res[0];
            if (person.name && person.name.length > 0) {
              document.getElementById('name').value = person.name[0];
            }
            if (person.tel && person.tel.length > 0) {
              var num = person.tel[0].replace(/[^0-9]/g, '');
              if (num.length > 10) num = num.slice(-10);
              document.getElementById('phone').value = num;
            }
            updateNoticeText();
          }
        } catch (err) {
          console.warn("Contacts API cancelled:", err);
        }
      } else {
        alert("మీ మొబైల్ బ్రౌజర్ డైరెక్ట్ కాంటాక్ట్ బుక్‌ని సపోర్ట్ చేయడం లేదు. దయచేసి నేరుగా పేరు, నంబర్ టైప్ చేయండి.");
      }
    }

    function fileChosen(input) {
      if (input.files && input.files[0]) {
        pickedFile = input.files[0];
        document.getElementById('fileBadge').classList.remove('hidden');
        var isImg = pickedFile.type.startsWith('image/');
        document.getElementById('fileBadgeText').innerText = isImg 
          ? '📸 Photo: ' + (pickedFile.name || 'Doc') 
          : '📄 PDF: ' + pickedFile.name;
      }
    }

    function removeFile() {
      pickedFile = null;
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('fileBadge').classList.add('hidden');
    }

    // Convert YYYY-MM-DD to DD/MM/YYYY
    function formatToIndianDate(isoStr) {
      if (!isoStr) return "";
      var p = isoStr.split('-');
      if (p.length === 3) {
        return p[2] + '/' + p[1] + '/' + p[0];
      }
      return isoStr;
    }

    // Set Due Date by Days selection
    function onDaysChange() {
      var days = parseInt(document.getElementById('daysSelect').value, 10) || 3;
      var d = new Date();
      d.setDate(d.getDate() + days);

      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');

      document.getElementById('datePickerInput').value = yyyy + '-' + mm + '-' + dd;
      updateNoticeText();
    }

    // When user manually picks a date from calendar
    function onCustomDateChange() {
      updateNoticeText();
    }

    function updateNoticeText() {
      var category = document.getElementById('categorySelect').value;
      var name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      var doc = document.getElementById('docName').value.trim() || '[రిఫరెన్స్ వివరాలు]';
      var rawDate = document.getElementById('datePickerInput').value;
      var dateFormatted = formatToIndianDate(rawDate);
      var days = document.getElementById('daysSelect').value || '3';
      var catText = category ? ' (' + category + ')' : '';

      var text = '*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n' +
                 'నమస్కారం ' + name + ' గారు,\n\n' +
                 'మీకు *' + doc + '* సంబంధించిన' + catText + ' ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.\n\n' +
                 'దయచేసి దీనిని విచారించి *' + days + ' రోజుల్లోగా* ' + (dateFormatted ? '(చివరి తేదీ: *' + dateFormatted + '*) ' : '') + 'మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.\n\n' +
                 'ఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*';

      document.getElementById('customMsg').value = text;
    }

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem('f8_records') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      renderDashboard();
    }

    function readFileAsDataURL(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = function(error) { reject(error); };
        reader.readAsDataURL(file);
      });
    }

    async function sendWhatsAppNotice() {
      var category = document.getElementById('categorySelect').value;
      var name = document.getElementById('name').value.trim();
      var rawPhone = document.getElementById('phone').value.trim();
      var doc = document.getElementById('docName').value.trim();
      var rawDate = document.getElementById('datePickerInput').value;
      var dueDateVal = formatToIndianDate(rawDate);
      var msg = document.getElementById('customMsg').value;

      if (!category) {
        alert('దయచేసి విభాగం (Category) ఎంచుకోండి!');
        return;
      }
      if (!name || !rawPhone || !doc || !dueDateVal) {
        alert('దయచేసి అన్ని వివరాలను నమోదు చేయండి!');
        return;
      }

      var cleanDigits = rawPhone.replace(/[^0-9]/g, '');
      if (cleanDigits.length > 10) cleanDigits = cleanDigits.slice(-10);
      if (cleanDigits.length !== 10) {
        alert('దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి!');
        return;
      }

      var fileDataUrl = null;
      var fileName = null;
      var fileType = null;
      if (pickedFile) {
        fileName = pickedFile.name || 'Captured_Doc';
        fileType = pickedFile.type.startsWith('image/') ? 'IMAGE' : 'PDF';
        try {
          fileDataUrl = await readFileAsDataURL(pickedFile);
        } catch(e) {}
      }

      var today = new Date();
      var sentDateFormatted = String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();

      var record = {
        id: Date.now(),
        category: category,
        name: name,
        phone: cleanDigits,
        docName: doc,
        fileName: fileName,
        fileData: fileDataUrl,
        fileType: fileType,
        sentDate: sentDateFormatted,
        dueDate: dueDateVal,
        daysAllowed: document.getElementById('daysSelect').value || '3',
        status: 'PENDING'
      };

      var list = getEntries();
      list.unshift(record);
      saveEntries(list);

      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      document.getElementById('categorySelect').value = '';
      removeFile();
      document.getElementById('daysSelect').value = '3';
      onDaysChange();

      if (pickedFile && navigator.canShare && navigator.canShare({ files: [pickedFile] })) {
        try {
          await navigator.share({ files: [pickedFile], title: category + ': ' + doc, text: msg });
          return;
        } catch (e) {}
      }

      window.location.href = 'https://api.whatsapp.com/send?phone=91' + cleanDigits + '&text=' + encodeURIComponent(msg);
    }

    function viewAttachment(id) {
      var item = getEntries().find(function(r) { return r.id === id; });
      if (item && item.fileData) {
        var w = window.open();
        if (item.fileType === 'IMAGE') {
          w.document.write('<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;"><img src="' + item.fileData + '" style="max-width:100%;max-height:100vh;"></body>');
        } else {
          w.document.write('<iframe src="' + item.fileData + '" frameborder="0" style="border:0;width:100%;height:100%;"></iframe>');
        }
      }
    }

    function markReturned(id) {
      saveEntries(getEntries().map(function(item) {
        return item.id === id ? Object.assign({}, item, { status: 'RETURNED' }) : item;
      }));
    }

    function sendReminder(phone, name, docName, dueDateStr, category) {
      var text = '*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n' +
                 '*అత్యవసర రిమైండర్:*\n' + name + ' గారు, మీకు ఇచ్చిన *' + docName + '* (' + (category || 'ఫైల్') + ') విచారణ గడువు తేదీ (*' + dueDateStr + '*) ముగిసినది.\n\n' +
                 'దయచేసి వెంటనే విచారణ నివేదికను కార్యాలయానికి సమర్పించగలరు.\n\n' +
                 'ఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*';
      window.location.href = 'https://api.whatsapp.com/send?phone=91' + phone + '&text=' + encodeURIComponent(text);
    }

    function deleteRecord(id) {
      if (confirm('ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
        saveEntries(getEntries().filter(function(item) { return item.id !== id; }));
      }
    }

    function renderDashboard() {
      var list = getEntries();
      var container = document.getElementById('recordList');
      if (!container) return;

      var pendingCount = list.filter(function(item) { return item.status === 'PENDING'; }).length;
      document.getElementById('pendingCount').innerText = pendingCount + ' Pending';

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(function(item) {
        return '<div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">' +
            '<div class="flex justify-between items-start">' +
              '<div>' +
                '<div class="flex items-center gap-1.5">' +
                  '<p class="font-bold text-sm text-slate-800">' + item.name + '</p>' +
                  '<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-bold">' + (item.category || 'Mutations') + '</span>' +
                '</div>' +
                '<p class="text-slate-500 font-mono text-[11px] mt-0.5">+91 ' + item.phone + '</p>' +
                '<p class="text-indigo-700 font-semibold mt-0.5">' + item.docName + '</p>' +
                (item.fileName ? ('<p class="text-slate-500 text-[10px] mt-0.5 flex items-center gap-1"><i class="fas ' + (item.fileType === 'IMAGE' ? 'fa-camera text-emerald-600' : 'fa-file-pdf text-red-500') + '"></i> ' + item.fileName + '</p>') : '') +
              '</div>' +
              '<div class="flex flex-col items-end gap-1">' +
                (item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ రిపోర్ట్ వచ్చింది</span>' 
                  : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">పెండింగ్</span>') +
                '<span class="text-[10px] text-slate-400 font-medium">గడువు: ' + item.daysAllowed + ' రోజులు</span>' +
              '</div>' +
            '</div>' +
            '<div class="flex justify-between text-slate-500 border-t pt-2 text-[11px]">' +
              '<span>పంపినది: <b>' + item.sentDate + '</b></span>' +
              '<span>చివరి తేదీ: <b>' + item.dueDate + '</b></span>' +
            '</div>' +
            '<div class="flex flex-wrap gap-1.5 pt-1 border-t">' +
              (item.fileData ? ('<button onclick="viewAttachment(' + item.id + ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold px-2.5 py-1.5 rounded-lg text-center flex items-center gap-1"><i class="fas ' + (item.fileType === 'IMAGE' ? 'fa-image text-emerald-600' : 'fa-eye text-indigo-600') + '"></i> ' + (item.fileType === 'IMAGE' ? 'ఫోటో చూడు' : 'PDF చూడు') + '</button>') : '') +
              (item.status === 'PENDING' ? ('<button onclick="sendReminder(\'' + item.phone + '\', \'' + item.name + '\', \'' + item.docName + '\', \'' + item.dueDate + '\', \'' + (item.category || 'Mutations') + '\')" class="flex-1 bg-amber-500 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">🔔 రిమైండ్</button><button onclick="markReturned(' + item.id + ')" class="flex-1 bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">✓ రిటర్న్</button>') : '<span class="flex-1 text-slate-400 py-1.5 text-center font-bold">పూర్తయింది</span>') +
              '<button onclick="deleteRecord(' + item.id + ')" class="px-2.5 py-1.5 bg-slate-200 text-slate-600 rounded-lg hover:text-red-600"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    // Direct initialization
    onDaysChange();
    renderDashboard();
  </script>
</body>
</html>
