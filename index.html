<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru - Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">F-8 మ్యుటేషన్ & PDF అధికారిక రిమైండర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" onclick="pickContact()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold px-2 py-1 rounded-lg">
          <i class="fas fa-address-book"></i> కాంటాక్ట్
        </button>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person)</label>
        <input type="text" id="name" oninput="updatePreviewMessage()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="రాము">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ (10 అంకెలు)</label>
        <input type="tel" id="phone" maxlength="10" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="9876543210">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / F-8 నంబర్</label>
        <input type="text" id="docName" oninput="updatePreviewMessage()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="F-8 Mutation No. 123/2026">
      </div>

      <!-- PDF File Upload Box -->
      <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-200">
        <label class="block text-xs font-bold text-indigo-900 mb-1">
          <i class="fas fa-file-pdf text-red-500"></i> PDF డాక్యుమెంట్ ఎంచుకోండి
        </label>
        <input type="file" id="pdfFile" accept="application/pdf" class="w-full border rounded-xl p-2 text-xs text-slate-600 bg-white">
      </div>

      <!-- Due Date Selection -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు రోజులు</label>
          <select id="daysSelect" onchange="handleDaysChange()" class="w-full border rounded-lg p-1.5 text-xs bg-white">
            <option value="2">2 రోజులు</option>
            <option value="7">7 రోజులు</option>
            <option value="15" selected>15 రోజులు</option>
            <option value="30">30 రోజులు</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు తేదీ</label>
          <input type="date" id="dueDateInput" onchange="updatePreviewMessage()" class="w-full border rounded-lg p-1.5 text-xs bg-white">
        </div>
      </div>

      <!-- Preview -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక మెసేజ్ ప్రివ్యూ:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed" readonly></textarea>
      </div>

      <!-- Buttons -->
      <div class="space-y-2">
        <button type="button" onclick="handleSendWithPdf()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow flex items-center justify-center gap-2">
          <i class="fab fa-whatsapp text-lg"></i> PDF & నోటీస్ షేర్ చేయి
        </button>
        <button type="button" onclick="handleSendTextDirect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
          <i class="fas fa-paper-plane"></i> డైరెక్ట్ టెక్స్ట్ మెసేజ్ పంపు (No PDF)
        </button>
      </div>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    async function pickContact() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (contacts.length > 0) {
            if (contacts[0].name?.[0]) document.getElementById('name').value = contacts[0].name[0];
            if (contacts[0].tel?.[0]) {
              let rawNum = contacts[0].tel[0].replace(/[^0-9]/g, '');
              if (rawNum.length > 10) rawNum = rawNum.slice(-10);
              document.getElementById('phone').value = rawNum;
            }
            updatePreviewMessage();
          }
        } catch (ex) {}
      } else {
        alert("Contact Picker support ledu. Direct ga type cheyandi.");
      }
    }

    function formatDateYMD(d) {
      return d.toISOString().split('T')[0];
    }

    function initDueDate() {
      const target = new Date();
      target.setDate(target.getDate() + 15);
      document.getElementById('dueDateInput').value = formatDateYMD(target);
      updatePreviewMessage();
    }

    function handleDaysChange() {
      const sel = parseInt(document.getElementById('daysSelect').value, 10);
      const d = new Date();
      d.setDate(d.getDate() + sel);
      document.getElementById('dueDateInput').value = formatDateYMD(d);
      updatePreviewMessage();
    }

    function getOfficialMessage(name, docName, dueDateVal) {
      let formattedDate = dueDateVal;
      let diffDays = 15;
      if (dueDateVal) {
        const d = new Date(dueDateVal);
        formattedDate = d.toLocaleDateString('en-GB');
        const sentDate = new Date();
        diffDays = Math.max(1, Math.ceil((d - sentDate) / (1000 * 60 * 60 * 24)));
      }
      return `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు*\n\nనమస్కారం ${name} గారు,\n\nమీకు *${docName}* సంబంధించిన ఫైల్ విచారణ నిమిత్తం పంపడమైనది.\n\nదయచేసి దీనిని విచారించి *${diffDays} రోజుల్లోగా* (చివరి తేదీ: *${formattedDate}*) మీ నివేదికను (Report) సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
    }

    function updatePreviewMessage() {
      const name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      const docName = document.getElementById('docName').value.trim() || '[డాక్యుమెంట్ నంబర్]';
      const dueDateVal = document.getElementById('dueDateInput').value;
      document.getElementById('customMsg').value = getOfficialMessage(name, docName, dueDateVal);
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('f8_records') || '[]');
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      render();
    }

    function validateAndSave() {
      const name = document.getElementById('name').value.trim();
      let phone = document.getElementById('phone').value.trim();
      const docName = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateInput').value;
      const fileInput = document.getElementById('pdfFile');
      const file = fileInput.files[0];

      if (!name || !phone || !docName || !dueDateVal) {
        alert('Peru, Phone, Document mariyu Thedi enter cheyandi!');
        return null;
      }

      phone = phone.replace(/[^0-9]/g, '');
      if (phone.length < 10) {
        alert('10 digits Mobile Number ivvandi!');
        return null;
      }
      if (phone.length === 10) phone = '91' + phone;

      const sentDate = new Date();
      const dueDateObj = new Date(dueDateVal);
      const diffDays = Math.max(1, Math.ceil((dueDateObj - sentDate) / (1000 * 60 * 60 * 24)));

      const record = {
        id: Date.now(),
        name,
        phone,
        docName,
        fileName: file ? file.name : 'PDF Document',
        sentDate: sentDate.toLocaleDateString('en-GB'),
        dueDate: dueDateObj.toLocaleDateString('en-GB'),
        dueDateRaw: dueDateVal,
        daysAllowed: diffDays,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      const officialMsg = getOfficialMessage(name, docName, dueDateVal);
      return { phone, file, officialMsg };
    }

    async function handleSendWithPdf() {
      const data = validateAndSave();
      if (!data) return;

      // Copy message to clipboard automatically
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(data.officialMsg);
      }

      if (data.file && navigator.canShare && navigator.canShare({ files: [data.file] })) {
        try {
          await navigator.share({
            files: [data.file],
            title: 'Tahsildar Office Peddavaduguru',
            text: data.officialMsg
          });
          alert('Tahsildar text copy aindi! Okavela chat lo text raakapothe direct ga PASTE cheyandi.');
          return;
        } catch (e) {}
      }

      window.location.href = `whatsapp://send?phone=${data.phone}&text=${encodeURIComponent(data.officialMsg)}`;
    }

    function handleSendTextDirect() {
      const data = validateAndSave();
      if (!data) return;
      window.location.href = `whatsapp://send?phone=${data.phone}&text=${encodeURIComponent(data.officialMsg)}`;
    }

    function markReturned(id) {
      const list = getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item);
      saveEntries(list);
    }

    function sendReminder(phone, name, docName, dueDateStr) {
      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు*\n\n*అత్యవసర రిమైండర్:*\n${name} గారు, మీకు ఇచ్చిన *${docName}* విచారణ గడువు తేదీ (*${dueDateStr}*) ముగిసినది.\n\nదయచేసి ఎలాంటి జాప్యం లేకుండా వెంటనే విచారణ నివేదికను సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు.*`;
      window.location.href = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('Delete cheyalani anukuntunnara?')) {
        saveEntries(getEntries().filter(item => item.id !== id));
      }
    }

    function render() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      const today = formatDateYMD(new Date());

      document.getElementById('pendingCount').innerText = `${list.filter(item => item.status === 'PENDING').length} Pending`;

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Inka elanti records levu.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && today > item.dueDateRaw;
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-sm text-slate-800">${item.name}</p>
                <p class="text-slate-500 font-mono text-[11px]">${item.phone}</p>
                <p class="text-indigo-700 font-semibold mt-0.5">${item.docName}</p>
              </div>
              <div>
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ రిపోర్ట్ వచ్చింది</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold text-[10px] animate-pulse">Overdue (ఆలస్యం)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">పెండింగ్</span>'}
              </div>
            </div>
            <div class="flex justify-between text-slate-500 border-t pt-2 text-[11px]">
              <span>పంపినది: <b>${item.sentDate}</b></span>
              <span>చివరి తేదీ: <b class="${isOverdue ? 'text-red-600' : ''}">${item.dueDate}</b></span>
            </div>
            <div class="flex gap-2 pt-1 border-t">
              ${item.status === 'PENDING' ? `
                <button onclick="sendReminder('${item.phone}', '${item.name}', '${item.docName}', '${item.dueDate}')" class="flex-1 bg-amber-500 text-white font-bold py-1.5 rounded-lg text-center">
                  🔔 రిమైండ్ పంపు
                </button>
                <button onclick="markReturned(${item.id})" class="flex-1 bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-center">
                  ✓ రిటర్న్ వచ్చింది
                </button>
              ` : '<span class="flex-1 text-slate-400 py-1 text-center font-bold">పూర్తయింది</span>'}
              <button onclick="deleteRecord(${item.id})"
