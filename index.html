<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">F-8 మ్యుటేషన్ అధికారిక నోటీస్ ట్రాకర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" onclick="pickContact()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
          <i class="fas fa-address-book"></i> కాంటాక్ట్
        </button>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person)</label>
        <input type="text" id="name" oninput="updateMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాజేష్">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ (10 అంకెలు)</label>
        <input type="tel" id="phone" maxlength="13" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="9876543210">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / F-8 నంబర్</label>
        <input type="text" id="docName" oninput="updateMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 Mutation Doc">
      </div>

      <!-- Due Date Selection -->
      <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు రోజులు</label>
          <select id="daysSelect" onchange="changeDays()" class="w-full border rounded-lg p-1.5 text-xs bg-white">
            <option value="1">1 రోజు</option>
            <option value="2">2 రోజులు</option>
            <option value="7">7 రోజులు</option>
            <option value="15" selected>15 రోజులు</option>
            <option value="30">30 రోజులు</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">గడువు తేదీ</label>
          <input type="date" id="dueDateInput" onchange="updateMsg()" class="w-full border rounded-lg p-1.5 text-xs bg-white">
        </div>
      </div>

      <!-- Message Box -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly></textarea>
      </div>

      <button type="button" onclick="sendWhatsAppNotice()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function changeDays() {
      const days = parseInt(document.getElementById('daysSelect').value, 10);
      const target = new Date();
      target.setDate(target.getDate() + days);
      document.getElementById('dueDateInput').value = formatDate(target);
      updateMsg();
    }

    function updateMsg() {
      const name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      const doc = document.getElementById('docName').value.trim() || '[F-8 నంబర్]';
      const dueDateVal = document.getElementById('dueDateInput').value;
      const days = document.getElementById('daysSelect').value;

      let dateStr = dueDateVal;
      if (dueDateVal) {
        const parts = dueDateVal.split('-');
        if (parts.length === 3) dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
      }

      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\nనమస్కారం ${name} గారు,\n\nమీకు *${doc}* సంబంధించిన ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.\n\nదయచేసి దీనిని విచారించి *${days} రోజుల్లోగా* (చివరి తేదీ: *${dateStr}*) మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      
      document.getElementById('customMsg').value = text;
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('f8_records') || '[]');
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      render();
    }

    function sendWhatsAppNotice() {
      const name = document.getElementById('name').value.trim();
      let rawPhone = document.getElementById('phone').value.trim();
      const doc = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateInput').value;
      const days = document.getElementById('daysSelect').value;
      const msg = document.getElementById('customMsg').value;

      if (!name || !rawPhone || !doc || !dueDateVal) {
        alert('దయచేసి పేరు, ఫోన్ నంబర్ మరియు డాక్యుమెంట్ వివరాలు నమోదు చేయండి!');
        return;
      }

      let cleanDigits = rawPhone.replace(/[^0-9]/g, '');
      if (cleanDigits.length > 10) cleanDigits = cleanDigits.slice(-10);
      if (cleanDigits.length !== 10) {
        alert('దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి!');
        return;
      }

      // రికార్డ్ సేవ్ చేయడం
      const today = new Date();
      const parts = dueDateVal.split('-');
      const formattedDue = `${parts[2]}/${parts[1]}/${parts[0]}`;

      const record = {
        id: Date.now(),
        name,
        phone: cleanDigits,
        docName: doc,
        sentDate: `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`,
        dueDate: formattedDue,
        dueDateRaw: dueDateVal,
        daysAllowed: days,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      // ఫారమ్ రీసెట్
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      changeDays();

      // వాట్సాప్ ఓపెన్ చేయడం
      window.location.href = `https://api.whatsapp.com/send?phone=91${cleanDigits}&text=${encodeURIComponent(msg)}`;
    }

    function markReturned(id) {
      const list = getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item);
      saveEntries(list);
    }

    function sendReminder(phone, name, docName, dueDateStr) {
      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n*అత్యవసర రిమైండర్:*\n${name} గారు, మీకు ఇచ్చిన *${docName}* విచారణ గడువు తేదీ (*${dueDateStr}*) ముగిసినది.\n\nమీరు నివేదిక సమర్పించడంలో ఆలస్యం (Delay) చేస్తున్నారు. దయచేసి ఎలాంటి జాప్యం లేకుండా వెంటనే విచారణ నివేదికను కార్యాలయానికి సమర్పించవలసిందిగా కోరడమైనది.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      window.location.href = `https://api.whatsapp.com/send?phone=91${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
        saveEntries(getEntries().filter(item => item.id !== id));
      }
    }

    function render() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      const today = formatDate(new Date());

      document.getElementById('pendingCount').innerText = `${list.filter(item => item.status === 'PENDING').length} Pending`;

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && today > item.dueDateRaw;
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-sm text-slate-800">${item.name}</p>
                <p class="text-slate-500 font-mono text-[11px]">${item.phone}</p>
                <p class="text-indigo-700 font-semibold mt-0.5">${item.docName}</p>
              </div>
              <div class="flex flex-col items-end gap-1">
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ రిపోర్ట్ వచ్చింది</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold text-[10px] animate-pulse">Overdue (ఆలస్యం)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">పెండింగ్</span>'}
                <span class="text-[10px] text-slate-400 font-medium">గడువు: ${item.daysAllowed} రోజులు</span>
              </div>
            </div>
            <div class="flex justify-between text-slate-500 border-t pt-2 text-[11px]">
              <span>పంపినది: <b>${item.sentDate}</b></span>
              <span>చివరి తేదీ: <b class="${isOverdue ? 'text-red-600' : ''}">${item.dueDate}</b></span>
            </div>
            <div class="flex gap-2 pt-1 border-t">
              ${item.status === 'PENDING' ? `
                <button onclick="sendReminder('${item.phone}', '${item.name}', '${item.docName}', '${item.dueDate}')" class="flex-1 bg-amber-500 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">
                  🔔 రిమైండ్ పంపు
                </button>
                <button onclick="markReturned(${item.id})" class="flex-1 bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-center shadow-sm">
                  ✓ రిటర్న్ వచ్చింది
                </button>
              ` : '<span class="flex-1 text-slate-400 py-1 text-center font-bold">పూర్తయింది</span>'}
              <button onclick="deleteRecord(${item.id})" class="px-2.5 py-1.5 bg-slate-200 text-slate-600 rounded-lg">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function pickContact() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (contacts.length > 0) {
            if (contacts[0].name?.[0]) document.getElementById('name').value = contacts[0].name[0];
            if (contacts[0].tel?.[0]) {
              let clean = contacts[0].tel[0].replace(/[^0-9]/g, '');
              if (clean.length > 10) clean = clean.slice(-10);
              document.getElementById('phone').value = clean;
            }
            updateMsg();
          }
        } catch (ex) {}
      } else {
        alert("కాంటాక్ట్ సెలెక్టర్ సపోర్ట్ లేదు. నంబర్ టైప్ చేయండి.");
      }
    }

    // మొదటిసారి లోడ్ కాగానే తేదీ & మెసేజ్ ఆటోమేటిక్‌గా సెట్ అవుతాయి
    changeDays();
    render();
  </script>
</body>
</html>
