<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">

  <div id="mainApp" class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">అధికారిక రికార్డుల & నోటీస్ ట్రాకర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" id="contactBtn" class="bg-indigo-50 active:bg-indigo-200 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
          <i class="fas fa-address-book text-indigo-600"></i> కాంటాక్ట్ ఎంచుకోండి
        </button>
      </div>

      <!-- Category Dropdown -->
      <div class="bg-amber-50/80 p-3 rounded-xl border-2 border-amber-300">
        <label class="block text-xs font-bold text-amber-900 mb-1 flex items-center gap-1.5">
          <i class="fas fa-list-check text-amber-600"></i> విభాగం ఎంచుకోండి (Category) <span class="text-red-500">*</span>
        </label>
        <select id="categorySelect" class="w-full border-2 border-amber-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 bg-white outline-none focus:border-indigo-600">
          <option value="" selected>-- ఎంచుకోండి (Select Category) --</option>
          <option value="Mutations">1. Mutations (మ్యుటేషన్స్)</option>
          <option value="PGRS">2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)</option>
          <option value="Mandala arjilu">3. Mandala arjilu (మండల అర్జీలు)</option>
          <option value="Others">4. Others (ఇతరములు)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person) <span class="text-red-500">*</span></label>
        <input type="text" id="name" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాజేష్">
      </div>

      <!-- Phone Number with +91 Prefix -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ <span class="text-red-500">*</span></label>
        <div class="flex items-center border rounded-xl overflow-hidden focus-within:border-indigo-600 bg-white">
          <span class="bg-slate-100 text-slate-700 font-bold px-3 py-2.5 text-sm border-r select-none">+91</span>
          <input type="tel" id="phone" maxlength="10" class="w-full p-2.5 text-sm outline-none" placeholder="9876543210">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ <span class="text-red-500">*</span></label>
        <input type="text" id="docName" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు">
      </div>

      <!-- Camera & PDF Attachment Section -->
      <div class="bg-indigo-50/90 p-3 rounded-xl border border-indigo-200 space-y-2">
        <label class="block text-xs font-bold text-indigo-900">
          📸 డాక్యుమెంట్ ఫోటో లేదా PDF జతచేయండి:
        </label>
        <div class="grid grid-cols-2 gap-2">
          <label class="cursor-pointer bg-emerald-600 active:bg-emerald-700 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-camera text-lg"></i>
            <span class="text-xs font-bold">కెమెరా ఓపెన్ చేయి</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
          </label>
          <label class="cursor-pointer bg-indigo-700 active:bg-indigo-800 text-white p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow">
            <i class="fas fa-file-pdf text-lg"></i>
            <span class="text-xs font-bold">PDF / ఫైల్స్</span>
            <input type="file" id="fileInput" accept="application/pdf,image/*" class="hidden">
          </label>
        </div>
        <div id="fileBadge" class="hidden bg-emerald-100 border border-emerald-300 text-emerald-900 text-xs p-2 rounded-xl font-bold flex items-center justify-between">
          <span id="fileBadgeText" class="truncate max-w-[220px]"></span>
          <button type="button" id="removeFileBtn" class="text-red-600 font-extrabold ml-2">✕ తీసివేయి</button>
        </div>
      </div>

      <!-- Due Date Selection -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-[11px] font-bold text-slate-700">గడువు రోజులు:</label>
          <span id="currentDaysBadge" class="text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold">7 రోజులు</span>
        </div>

        <div class="grid grid-cols-5 gap-1.5">
          <button type="button" class="day-btn py-2 text-xs bg-white border border-slate-300 rounded-lg font-bold shadow-sm" data-days="1">1 D</button>
          <button type="button" class="day-btn py-2 text-xs bg-white border border-slate-300 rounded-lg font-bold shadow-sm" data-days="2">2 D</button>
          <button type="button" class="day-btn py-2 text-xs bg-indigo-600 text-white border border-indigo-600 rounded-lg font-bold shadow-sm" data-days="7">7 D</button>
          <button type="button" class="day-btn py-2 text-xs bg-white border border-slate-300 rounded-lg font-bold shadow-sm" data-days="15">15 D</button>
          <button type="button" class="day-btn py-2 text-xs bg-white border border-slate-300 rounded-lg font-bold shadow-sm" data-days="30">30 D</button>
        </div>

        <div class="flex items-center gap-1.5 pt-1">
          <input type="text" id="dueDateField" class="w-full border-2 border-indigo-300 rounded-lg p-2 text-xs bg-white font-bold outline-none text-center" placeholder="DD/MM/YYYY">
          <label class="cursor-pointer bg-indigo-700 active:bg-indigo-900 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow">
            <i class="fas fa-calendar-alt"></i>
            <input type="date" id="calendarPicker" class="hidden">
          </label>
        </div>
      </div>

      <!-- Message Preview Box -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్ ప్రివ్యూ:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly></textarea>
      </div>

      <button type="button" id="sendBtn" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    let pickedFile = null;
    let selectedDaysCount = 7;

    // 1. Contact Picker (Safe Mobile Implementation)
    document.getElementById('contactBtn').addEventListener('click', async () => {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['name', 'tel'];
          const contacts = await navigator.contacts.select(props, { multiple: false });
          if (contacts && contacts.length > 0) {
            const contact = contacts[0];
            if (contact.name && contact.name[0]) {
              document.getElementById('name').value = contact.name[0];
            }
            if (contact.tel && contact.tel[0]) {
              let clean = contact.tel[0].replace(/[^0-9]/g, '');
              if (clean.length > 10) clean = clean.slice(-10);
              document.getElementById('phone').value = clean;
            }
            renderNotice();
          }
        } catch (err) {
          console.warn('Contact picker cancelled or blocked:', err);
        }
      } else {
        alert('మీ బ్రౌజర్ నేరుగా కాంటాక్ట్ సెలెక్షన్‌కు అనుమతించట్లేదు. దయచేసి పేరు, నంబర్ నేరుగా టైప్ చేయండి.');
      }
    });

    // 2. Date Calculation & Update Engine
    function setDaysAndDate(days) {
      selectedDaysCount = parseInt(days, 10) || 7;

      document.querySelectorAll('.day-btn').forEach(btn => {
        if (parseInt(btn.getAttribute('data-days'), 10) === selectedDaysCount) {
          btn.className = "day-btn py-2 text-xs bg-indigo-600 text-white border border-indigo-600 rounded-lg font-bold shadow-sm";
        } else {
          btn.className = "day-btn py-2 text-xs bg-white border border-slate-300 rounded-lg font-bold shadow-sm";
        }
      });

      document.getElementById('currentDaysBadge').innerText = `${selectedDaysCount} రోజులు`;

      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + selectedDaysCount);

      const dd = String(targetDate.getDate()).padStart(2, '0');
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const yyyy = targetDate.getFullYear();

      document.getElementById('dueDateField').value = `${dd}/${mm}/${yyyy}`;
      renderNotice();
    }

    // Attach listeners to Quick-Days Buttons
    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const d = e.currentTarget.getAttribute('data-days');
        setDaysAndDate(d);
      });
    });

    // Native Calendar Picker Change
    document.getElementById('calendarPicker').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val) {
        const parts = val.split('-');
        if (parts.length === 3) {
          document.getElementById('dueDateField').value = `${parts[2]}/${parts[1]}/${parts[0]}`;
          
          const sel = new Date(parts[0], parts[1] - 1, parts[2]);
          const now = new Date();
          now.setHours(0,0,0,0);
          sel.setHours(0,0,0,0);
          const diff = Math.round((sel - now) / (1000 * 60 * 60 * 24));
          if (diff > 0) {
            selectedDaysCount = diff;
            document.getElementById('currentDaysBadge').innerText = `${diff} రోజులు`;
          }
          renderNotice();
        }
      }
    });

    // 3. Render Notice Preview
    function renderNotice() {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      const doc = document.getElementById('docName').value.trim() || '[రిఫరెన్స్ వివరాలు]';
      const dateVal = document.getElementById('dueDateField').value.trim();

      const catText = category ? ` (${category})` : '';

      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n` +
                   `నమస్కారం ${name} గారు,\n\n` +
                   `మీకు *${doc}* సంబంధించిన${catText} ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.\n\n` +
                   `దయచేసి దీనిని విచారించి *${selectedDaysCount} రోజుల్లోగా* ${dateVal ? `(చివరి తేదీ: *${dateVal}*) ` : ''}మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.\n\n` +
                   `ఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;

      document.getElementById('customMsg').value = text;
    }

    ['categorySelect', 'name', 'docName', 'dueDateField'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', renderNotice);
      el.addEventListener('change', renderNotice);
    });

    // 4. File Upload & Camera
    function handleSelectedFile(file) {
      if (!file) return;
      pickedFile = file;
      document.getElementById('fileBadge').classList.remove('hidden');
      const isImg = pickedFile.type.startsWith('image/');
      document.getElementById('fileBadgeText').innerText = isImg 
        ? `📸 Photo: ${pickedFile.name || 'Captured Image'}` 
        : `📄 PDF: ${pickedFile.name}`;
    }

    document.getElementById('cameraInput').addEventListener('change', (e) => handleSelectedFile(e.target.files[0]));
    document.getElementById('fileInput').addEventListener('change', (e) => handleSelectedFile(e.target.files[0]));
    
    document.getElementById('removeFileBtn').addEventListener('click', () => {
      pickedFile = null;
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('fileBadge').classList.add('hidden');
    });

    // 5. WhatsApp Sending & LocalStorage Records
    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem('f8_records') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      renderDashboard();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('name').value.trim();
      let rawPhone = document.getElementById('phone').value.trim();
      const doc = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateField').value.trim();
      const msg = document.getElementById('customMsg').value;

      if (!category) {
        alert('దయచేసి ముందుగా విభాగం (Category) ను ఎంచుకోండి!');
        document.getElementById('categorySelect').focus();
        return;
      }

      if (!name || !rawPhone || !doc || !dueDateVal) {
        alert('దయచేసి వివరాలన్నీ నమోదు చేయండి!');
        return;
      }

      let cleanDigits = rawPhone.replace(/[^0-9]/g, '');
      if (cleanDigits.length > 10) cleanDigits = cleanDigits.slice(-10);
      if (cleanDigits.length !== 10) {
        alert('సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి!');
        return;
      }

      let fileDataUrl = null;
      let fileName = null;
      let fileType = null;
      if (pickedFile) {
        fileName = pickedFile.name || 'Captured_Doc';
        fileType = pickedFile.type.startsWith('image/') ? 'IMAGE' : 'PDF';
        try {
          fileDataUrl = await readFileAsDataURL(pickedFile);
        } catch(e) {}
      }

      const today = new Date();
      const sentDateFormatted = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;

      const record = {
        id: Date.now(),
        category,
        name,
        phone: cleanDigits,
        docName: doc,
        fileName: fileName,
        fileData: fileDataUrl,
        fileType: fileType,
        sentDate: sentDateFormatted,
        dueDate: dueDateVal,
        daysAllowed: selectedDaysCount,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      // Form reset
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('removeFileBtn').click();
      setDaysAndDate(7);

      if (pickedFile && navigator.canShare && navigator.canShare({ files: [pickedFile] })) {
        try {
          await navigator.share({
            files: [pickedFile],
            title: `${category}: ${doc}`,
            text: msg
          });
          return;
        } catch (e) {}
      }

      window.location.href = `https://api.whatsapp.com/send?phone=91${cleanDigits}&text=${encodeURIComponent(msg)}`;
    });

    function viewAttachment(id) {
      const item = getEntries().find(r => r.id === id);
      if (item && item.fileData) {
        const newWindow = window.open();
        if (item.fileType === 'IMAGE') {
          newWindow.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;"><img src="${item.fileData}" style="max-width:100%;max-height:100vh;object-fit:contain;"></body>`);
        } else {
          newWindow.document.write(`<iframe src="${item.fileData}" frameborder="0" style="border:0;width:100%;height:100%;" allowfullscreen></iframe>`);
        }
      }
    }

    function markReturned(id) {
      saveEntries(getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item));
    }

    function sendReminder(phone, name, docName, dueDateStr, category) {
      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n` +
                   `*అత్యవసర రిమైండర్:*\n${name} గారు, మీకు ఇచ్చిన *${docName}* (${category}) విచారణ గడువు తేదీ (*${dueDateStr}*) ముగిసినది.\n\n` +
                   `మీరు నివేదిక సమర్పించడంలో ఆలస్యం (Delay) చేస్తున్నారు. దయచేసి వెంటనే విచారణ నివేదికను సమర్పించగలరు.\n\n` +
                   `ఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      window.location.href = `https://api.whatsapp.com/send?phone=91${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
        saveEntries(getEntries().filter(item => item.id !== id));
      }
    }

    function renderDashboard() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      if (!container) return;

      const pendingCount = list.filter(item => item.status === 'PENDING').length;
      document.getElementById('pendingCount').innerText = `${pendingCount} Pending`;

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-1.5">
                  <p class="font-bold text-sm text-slate-800">${item.name}</p>
                  <span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-bold">${item.category || 'Mutations'}</span>
                </div>
                <p class="text-slate-500 font-mono text-[11px] mt-0.5">+91 ${item.phone}</p>
                <p class="text-indigo-700 font-semibold mt-0.5">${item.docName}</p>
                ${item.fileName ? `
                  <p class="text-slate-500 text-[10px] mt-0.5 flex items-center gap-1">
                    <i class="fas ${item.fileType === 'IMAGE' ? 'fa-cam
