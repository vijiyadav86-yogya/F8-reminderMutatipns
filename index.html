<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-3 text-slate-800">

  <div id="mainApp" class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-indigo-800 text-white p-5 rounded-2xl shadow border-b-4 border-amber-500 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-landmark text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-base font-bold">తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
          <p class="text-indigo-200 text-xs">అధికారిక రికార్డుల & నోటీస్ ట్రాకర్</p>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-700">కొత్త ఎంట్రీ & నోటీస్</h2>
        <button type="button" onclick="pickContact()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
          <i class="fas fa-address-book"></i> కాంటాక్ట్
        </button>
      </div>

      <!-- Category Dropdown -->
      <div class="bg-amber-50/80 p-3 rounded-xl border-2 border-amber-300">
        <label class="block text-xs font-bold text-amber-900 mb-1 flex items-center gap-1.5">
          <i class="fas fa-list-check text-amber-600"></i> విభాగం ఎంచుకోండి (Category) <span class="text-red-500">*</span>
        </label>
        <select id="categorySelect" onchange="updateMsg()" class="w-full border-2 border-amber-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 bg-white outline-none focus:border-indigo-600">
          <option value="" selected disabled>-- Select / ఎంచుకోండి --</option>
          <option value="Mutations">1. Mutations (మ్యుటేషన్స్)</option>
          <option value="PGRS">2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)</option>
          <option value="Mandala arjilu">3. Mandala arjilu (మండల అర్జీలు)</option>
          <option value="Others">4. Others (ఇతరములు)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు (VRO / Person) <span class="text-red-500">*</span></label>
        <input type="text" id="name" oninput="updateMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: రాజేష్">
      </div>

      <!-- Phone Number with +91 Prefix -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">WhatsApp నంబర్ <span class="text-red-500">*</span></label>
        <div class="flex items-center border rounded-xl overflow-hidden focus-within:border-indigo-600 bg-white">
          <span class="bg-slate-100 text-slate-700 font-bold px-3 py-2.5 text-sm border-r select-none">+91</span>
          <input type="tel" id="phone" maxlength="10" class="w-full p-2.5 text-sm outline-none" placeholder="9876543210">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ <span class="text-red-500">*</span></label>
        <input type="text" id="docName" oninput="updateMsg()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:border-indigo-600" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు">
      </div>

      <!-- PDF / CAMERA / PHOTO UPLOAD BOX -->
      <div class="bg-indigo-50/80 p-3 rounded-xl border-2 border-indigo-200 space-y-2">
        <label class="block text-xs font-bold text-indigo-900 flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <i class="fas fa-file-pdf text-red-500"></i> / <i class="fas fa-camera text-indigo-600"></i> ఫైల్ లేదా ఫోటో జతచేయండి
          </span>
          <span class="text-[10px] text-indigo-600 font-normal">PDF లేదా Photo</span>
        </label>
        
        <div class="grid grid-cols-2 gap-2">
          <!-- Option A: File / PDF / Gallery -->
          <label class="cursor-pointer bg-white border border-indigo-300 hover:bg-indigo-50 p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow-sm">
            <i class="fas fa-paperclip text-indigo-600 text-lg"></i>
            <span class="text-[11px] font-bold text-slate-700">PDF / ఫైల్ ఎంచుకోండి</span>
            <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="handleFileSelected(this)" class="hidden">
          </label>

          <!-- Option B: Direct Camera Snap -->
          <label class="cursor-pointer bg-white border border-emerald-300 hover:bg-emerald-50 p-2.5 rounded-xl text-center flex flex-col items-center justify-center gap-1 shadow-sm">
            <i class="fas fa-camera text-emerald-600 text-lg"></i>
            <span class="text-[11px] font-bold text-slate-700">కెమెరాతో ఫోటో తీయి</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelected(this)" class="hidden">
          </label>
        </div>

        <div id="fileSelectedBadge" class="hidden bg-emerald-100 text-emerald-800 text-[11px] p-2 rounded-lg font-bold flex items-center justify-between">
          <span id="fileSelectedName" class="truncate max-w-[240px]"></span>
          <button type="button" onclick="clearSelectedFile()" class="text-red-500 hover:text-red-700 ml-2">
            <i class="fas fa-times-circle"></i>
          </button>
        </div>
      </div>

      <!-- Manual Due Date Selection -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">
            📅 గడువు తేదీ (Due Date Manual Entry) <span class="text-red-500">*</span>
          </label>
          <input type="date" id="dueDateInput" oninput="onDatePicked()" onchange="onDatePicked()" class="w-full border-2 border-indigo-300 rounded-xl p-2.5 text-sm bg-white font-bold outline-none focus:border-indigo-600">
        </div>
        <div class="flex gap-1.5 pt-1">
          <button type="button" onclick="setQuickDays(2)" class="flex-1 bg-white border border-slate-300 text-slate-700 py-1 text-xs rounded-lg font-semibold hover:bg-slate-100">2 Days</button>
          <button type="button" onclick="setQuickDays(7)" class="flex-1 bg-white border border-slate-300 text-slate-700 py-1 text-xs rounded-lg font-semibold hover:bg-slate-100">7 Days</button>
          <button type="button" onclick="setQuickDays(15)" class="flex-1 bg-white border border-slate-300 text-slate-700 py-1 text-xs rounded-lg font-semibold hover:bg-slate-100">15 Days</button>
          <button type="button" onclick="setQuickDays(30)" class="flex-1 bg-white border border-slate-300 text-slate-700 py-1 text-xs rounded-lg font-semibold hover:bg-slate-100">30 Days</button>
        </div>
        <p id="dateHint" class="text-[10px] text-indigo-700 font-medium">* Date బాక్స్‌పై క్లిక్ చేసి నేరుగా తేదీ మార్చుకోవచ్చు.</p>
      </div>

      <!-- Message Preview Box -->
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్ ప్రివ్యూ:</label>
        <textarea id="customMsg" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-sans text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly></textarea>
      </div>

      <button type="button" onclick="sendWhatsAppNotice()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2">
        <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
      </button>
    </div>

    <!-- Records Dashboard -->
    <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
        <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">0 Pending</span>
      </div>
      <div id="recordList" class="space-y-3"></div>
    </div>

  </div>

  <script>
    let activeFile = null;

    function handleFileSelected(input) {
      if (input.files && input.files[0]) {
        activeFile = input.files[0];
        document.getElementById('fileSelectedBadge').classList.remove('hidden');
        const isImg = activeFile.type.startsWith('image/');
        document.getElementById('fileSelectedName').innerHTML = isImg 
          ? `<i class="fas fa-camera text-emerald-600"></i> ఫోటో జతచేయబడింది: ${activeFile.name}` 
          : `<i class="fas fa-file-pdf text-red-600"></i> PDF జతచేయబడింది: ${activeFile.name}`;
      }
    }

    function clearSelectedFile() {
      activeFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileSelectedBadge').classList.add('hidden');
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function initDefaultDate() {
      const target = new Date();
      target.setDate(target.getDate() + 15);
      document.getElementById('dueDateInput').value = formatDate(target);
      onDatePicked();
    }

    function setQuickDays(days) {
      const target = new Date();
      target.setDate(target.getDate() + days);
      document.getElementById('dueDateInput').value = formatDate(target);
      onDatePicked();
    }

    function onDatePicked() {
      const val = document.getElementById('dueDateInput').value;
      const hint = document.getElementById('dateHint');
      if (val) {
        const selDate = new Date(val);
        const today = new Date();
        today.setHours(0,0,0,0);
        selDate.setHours(0,0,0,0);
        const diffDays = Math.round((selDate - today) / (1000 * 60 * 60 * 24));
        
        if (hint) {
          hint.innerText = diffDays > 0 
            ? `* ఎంచుకున్న తేదీ వరకు సరిగ్గా ${diffDays} రోజుల గడువు ఉంది (${selDate.toLocaleDateString('en-GB')}).` 
            : `* ఎంచుకున్న తేదీ: ${selDate.toLocaleDateString('en-GB')}`;
        }
      }
      updateMsg();
    }

    function calculateDiffDays(dueDateVal) {
      if (!dueDateVal) return 15;
      const selDate = new Date(dueDateVal);
      const today = new Date();
      today.setHours(0,0,0,0);
      selDate.setHours(0,0,0,0);
      const diff = Math.round((selDate - today) / (1000 * 60 * 60 * 24));
      return diff > 0 ? diff : 1;
    }

    function updateMsg() {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('name').value.trim() || '[గ్రహీత పేరు]';
      const doc = document.getElementById('docName').value.trim() || '[రిఫరెన్స్ వివరాలు]';
      const dueDateVal = document.getElementById('dueDateInput').value;
      const days = calculateDiffDays(dueDateVal);

      let dateStr = dueDateVal;
      if (dueDateVal) {
        const parts = dueDateVal.split('-');
        if (parts.length === 3) dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
      }

      const catText = category ? `(${category})` : '';

      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\nనమస్కారం ${name} గారు,\n\nమీకు *${doc}* సంబంధించిన ${catText} ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.\n\nదయచేసి దీనిని విచారించి *${days} రోజుల్లోగా* (చివరి తేదీ: *${dateStr}*) మీ నివేదికను (Report) కార్యాలయానికి సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      
      document.getElementById('customMsg').value = text;
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('f8_records') || '[]');
    }

    function saveEntries(data) {
      localStorage.setItem('f8_records', JSON.stringify(data));
      render();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function sendWhatsAppNotice() {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('name').value.trim();
      let rawPhone = document.getElementById('phone').value.trim();
      const doc = document.getElementById('docName').value.trim();
      const dueDateVal = document.getElementById('dueDateInput').value;
      const msg = document.getElementById('customMsg').value;

      if (!category) {
        alert('దయచేసి విభాగం (Category) ఎంచుకోండి!');
        document.getElementById('categorySelect').focus();
        return;
      }

      if (!name || !rawPhone || !doc || !dueDateVal) {
        alert('దయచేసి పేరు, ఫోన్ నంబర్, డాక్యుమెంట్ వివరాలు మరియు గడువు తేదీని నమోదు చేయండి!');
        return;
      }

      let cleanDigits = rawPhone.replace(/[^0-9]/g, '');
      if (cleanDigits.length > 10) cleanDigits = cleanDigits.slice(-10);
      if (cleanDigits.length !== 10) {
        alert('సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి!');
        return;
      }

      let fileDataUrl = null;
      let fileName = null;
      let fileType = null;
      if (activeFile) {
        fileName = activeFile.name;
        fileType = activeFile.type.startsWith('image/') ? 'IMAGE' : 'PDF';
        try {
          fileDataUrl = await readFileAsDataURL(activeFile);
        } catch(e) {
          console.log("File read error:", e);
        }
      }

      const today = new Date();
      const parts = dueDateVal.split('-');
      const formattedDue = `${parts[2]}/${parts[1]}/${parts[0]}`;
      const days = calculateDiffDays(dueDateVal);

      const record = {
        id: Date.now(),
        category,
        name,
        phone: cleanDigits,
        docName: doc,
        fileName: fileName,
        fileData: fileDataUrl,
        fileType: fileType,
        sentDate: `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`,
        dueDate: formattedDue,
        dueDateRaw: dueDateVal,
        daysAllowed: days,
        status: 'PENDING'
      };

      const list = getEntries();
      list.unshift(record);
      saveEntries(list);

      // Form reset
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('docName').value = '';
      document.getElementById('categorySelect').value = '';
      clearSelectedFile();
      initDefaultDate();
      updateMsg();

      // Mobile share
      if (activeFile && navigator.canShare && navigator.canShare({ files: [activeFile] })) {
        try {
          await navigator.share({
            files: [activeFile],
            title: `${category}: ${doc}`,
            text: msg
          });
          return;
        } catch (e) {
          console.log('Share dismissed');
        }
      }

      window.location.href = `https://api.whatsapp.com/send?phone=91${cleanDigits}&text=${encodeURIComponent(msg)}`;
    }

    function viewAttachment(id) {
      const item = getEntries().find(r => r.id === id);
      if (item && item.fileData) {
        const newWindow = window.open();
        if (item.fileType === 'IMAGE') {
          newWindow.document.write(`<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;"><img src="${item.fileData}" style="max-width:100%;max-height:100vh;object-fit:contain;"></body>`);
        } else {
          newWindow.document.write(`<iframe src="${item.fileData}" frameborder="0" style="border:0;width:100%;height:100%;" allowfullscreen></iframe>`);
        }
      } else {
        alert("ఈ రికార్డుకు ఎలాంటి ఫైల్ లేదా ఫోటో అప్‌లోడ్ చేయబడలేదు!");
      }
    }

    function markReturned(id) {
      saveEntries(getEntries().map(item => item.id === id ? { ...item, status: 'RETURNED' } : item));
    }

    function sendReminder(phone, name, docName, dueDateStr, category) {
      const text = `*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*\n\n*అత్యవసర రిమైండర్:*\n${name} గారు, మీకు ఇచ్చిన *${docName}* (${category}) విచారణ గడువు తేదీ (*${dueDateStr}*) ముగిసినది.\n\nమీరు నివేదిక సమర్పించడంలో ఆలస్యం (Delay) చేస్తున్నారు. దయచేసి వెంటనే విచారణ నివేదికను సమర్పించగలరు.\n\nఇట్లు,\n*తహసీల్దార్ కార్యాలయం,*\n*పెద్దవడుగూరు.*`;
      window.location.href = `https://api.whatsapp.com/send?phone=91${phone}&text=${encodeURIComponent(text)}`;
    }

    function deleteRecord(id) {
      if (confirm('ఈ రికార్డును తొలగించాలనుకుంటున్నారా?')) {
        saveEntries(getEntries().filter(item => item.id !== id));
      }
    }

    function render() {
      const list = getEntries();
      const container = document.getElementById('recordList');
      if (!container) return;
      const today = formatDate(new Date());

      const pendingBadge = document.getElementById('pendingCount');
      if (pendingBadge) {
        pendingBadge.innerText = `${list.filter(item => item.status === 'PENDING').length} Pending`;
      }

      if (list.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ఇంకా ఎలాంటి రికార్డులు లేవు.</p>';
        return;
      }

      container.innerHTML = list.map(item => {
        const isOverdue = item.status === 'PENDING' && today > item.dueDateRaw;
        return `
          <div class="border rounded-xl p-3 bg-slate-50 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-1.5">
                  <p class="font-bold text-sm text-slate-800">${item.name}</p>
                  <span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.2 rounded font-bold">${item.category || 'Mutations'}</span>
                </div>
                <p class="text-slate-500 font-mono text-[11px] mt-0.5">+91 ${item.phone}</p>
                <p class="text-indigo-700 font-semibold mt-0.5">${item.docName}</p>
                ${item.fileName ? `
                  <p class="text-slate-500 text-[10px] mt-0.5 flex items-center gap-1">
                    <i class="fas ${item.fileType === 'IMAGE' ? 'fa-camera text-emerald-600' : 'fa-file-pdf text-red-500'}"></i> ${item.fileName}
                  </p>
                ` : ''}
              </div>
              <div class="flex flex-col items-end gap-1">
                ${item.status === 'RETURNED' 
                  ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ రిపోర్ట్ వచ్చింది</span>' 
                  : isOverdue 
                    ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold text-[10px] animate-pulse">Overdue (ఆలస్యం)</span>' 
                    : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold text-[10px]">పెండింగ్</span>'}
